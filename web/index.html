<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVS-Gateway Installer</title>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            max-width: 360px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
        }

        p {
            color: #64748b;
            font-size: 0.875rem;
            margin: 0 0 24px 0;
        }
    </style>

    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>

<body>
    <div class="card">
        <h1>LVS-Gateway Installer</h1>
        <p>Connect your device via USB to install LVS-Gateway.</p>
        <esp-web-install-button manifest="esp-webtools-manifest.json"></esp-web-install-button>
    </div>
</body>

</html>
